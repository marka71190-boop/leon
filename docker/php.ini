; Лимиты загрузки фото, видео и PDF через админку
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 120
max_input_time = 300
date.timezone = Europe/Moscow
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.cookie_httponly = 1
session.use_strict_mode = 1
