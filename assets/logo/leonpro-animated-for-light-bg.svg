<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 540 430" width="540" height="430"><style>.a,.b,.c{transform-box:fill-box;transform-origin:50% 100%}
.a{animation:kA 7s cubic-bezier(.2,.8,.2,1) infinite both}.b{animation:kB 7s cubic-bezier(.2,.8,.2,1) infinite both}.c{animation:kC 7s cubic-bezier(.2,.8,.2,1) infinite both}
.band{transform-box:fill-box;transform-origin:50% 50%;animation:kBand 7s cubic-bezier(.2,.8,.2,1) infinite both}
.word{animation:kWord 7s cubic-bezier(.2,.8,.2,1) infinite both}
.shine{animation:kShine 7s ease-in-out infinite both}
@keyframes kA{0%{transform:scaleY(0);opacity:0}2%{opacity:1}12%{transform:scaleY(1)}86%{opacity:1;transform:scaleY(1)}93%,100%{opacity:0;transform:scaleY(1)}}
@keyframes kB{0%,4%{transform:scaleY(0);opacity:0}6%{opacity:1}16%{transform:scaleY(1)}86%{opacity:1;transform:scaleY(1)}93%,100%{opacity:0;transform:scaleY(1)}}
@keyframes kC{0%,9%{transform:scaleY(0);opacity:0}11%{opacity:1}21%{transform:scaleY(1)}86%{opacity:1;transform:scaleY(1)}93%,100%{opacity:0;transform:scaleY(1)}}
@keyframes kBand{0%,17%{transform:scaleX(0);opacity:0}19%{opacity:1}27%{transform:scaleX(1)}86%{opacity:1;transform:scaleX(1)}93%,100%{opacity:0;transform:scaleX(1)}}
@keyframes kWord{0%,25%{opacity:0}36%{opacity:1}86%{opacity:1}93%,100%{opacity:0}}
@keyframes kShine{0%,38%{transform:translateX(0)}52%,100%{transform:translateX(760px)}}
@media (prefers-reduced-motion:reduce){.a,.b,.c,.band,.word,.shine{animation:none}}
</style><defs><linearGradient id="lpOr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59A3A"/><stop offset="1" stop-color="#D9620F"/></linearGradient><linearGradient id="lpBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E5701A"/><stop offset=".5" stop-color="#F58C2C"/><stop offset="1" stop-color="#E06A14"/></linearGradient><clipPath id="lpClip"><polygon points="320,140 170,400 470,400"/><polygon points="90,360 510,360 560,450 40,450"/></clipPath></defs><polygon class="a" points="250,40 40,400 460,400" fill="#17171A"/><polygon class="b" points="330,70 130,400 530,400" fill="#17171A"/><polygon class="c" points="320,140 170,400 470,400" fill="url(#lpOr)"/><polygon class="band" points="90,360 510,360 560,450 40,450" fill="url(#lpBand)"/><g clip-path="url(#lpClip)"><rect class="shine" x="-140" y="100" width="70" height="380" fill="#fff" opacity=".35" transform="skewX(-20)"/></g><g class="word" transform="translate(160.5 424) scale(0.9)"><g fill="none" stroke="#17171A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(0 0)" d="M0,-44 V0 H22"/><path transform="translate(35 0)" d="M1,-15 H30 A15,15 0 1 0 25.6,-4.4"/><path transform="translate(78 0)" d="M15,-30 A15,15 0 1 1 14.99,-30 Z"/><path transform="translate(121 0)" d="M0,-30 V0 M0,-15 A15,15 0 0 1 30,-15 V0"/><path transform="translate(164 0)" d="M0,4 H30"/><path transform="translate(207 0)" d="M0,-30 V14 M15,-30 A15,15 0 1 1 14.99,-30 Z"/><path transform="translate(250 0)" d="M0,-30 V0 M0,-13 A17,17 0 0 1 17,-30"/><path transform="translate(280 0)" d="M15,-30 A15,15 0 1 1 14.99,-30 Z"/></g></g></svg>
